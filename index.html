<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乃木フェス ライバル分析</title><link rel="stylesheet" href="style.css"></head><body><header>乃木フェス ライバル分析</header><nav><button data-tab="analysis">分析</button><button data-tab="scan">スクショ</button><button data-tab="history">履歴</button><button data-tab="settings">設定</button></nav><main>
<section id="settings"><h2>プレイヤー・計算設定</h2><form id="settingsForm"><label>自分の名前<input id="me" required></label><label>相手の名前<input id="rival" required></label><label>相手の特攻値 (%)<input id="bonus" type="number" min="0" max="9999" value="2640" required></label><label>通常曲<select id="normal"><option value="212">最後のTightHug (3:32)</option><option value="213">サヨナラの意味 (3:33)</option><option value="214">三番目の風 (3:34)</option><option value="200">渋谷ブルース (3:20)</option></select></label><label>イベント曲時間（秒）<input id="event" type="number" min="1" value="183" required></label><label>イベント曲1回のpt（実測値で上書き可能）<input id="override" type="number" min="1" placeholder="自動計算"></label><label>最初の観測時の相手のアイテム下限<input id="low" type="number" min="0" max="99999" value="0" required></label><label>最初の観測時の相手のアイテム上限<input id="high" type="number" min="0" max="99999" value="99999" required></label><button class="primary">設定を保存</button></form></section>
<section id="scan" hidden><h2>スクショ登録</h2><label>画像を選択（任意）<input id="file" type="file" accept="image/*"></label><img id="preview" hidden alt="選択画像"><button id="ocr" type="button">画像から名前・ptを読み取る</button><p id="status" role="status"></p><div id="candidates"></div><p class="note">ゲームの横長ランキング画面をそのまま選択してください。認識には通信が必要です。失敗時は手入力できます。</p><form id="recordForm"><label>撮影日時（必ず確認）<input id="date" type="datetime-local" step="1" required></label><label id="meLabel">自分のpt</label><input id="mp" type="number" min="0" step="1" placeholder="未取得なら空欄"><label id="rivalLabel">相手のpt</label><input id="rp" type="number" min="0" step="1" placeholder="未取得なら空欄"><label>前回の相手観測からの行動（仮定）<select id="action"><option value="auto">不明（自動推定）</option><option value="normal">通常曲バクグラのみ</option><option value="event">イベント曲バクグラのみ</option><option value="rest">休憩のみ</option></select></label><button class="primary">記録を保存</button></form><details><summary>認識テキスト</summary><textarea id="raw" rows="7"></textarea></details></section>
<section id="analysis" hidden><h2>現在の状況</h2><div id="summary"></div><h2>ポイント推移</h2><div id="chart"></div><h2>相手のアイテム推定</h2><div id="estimate"></div><p class="note">推定はバクグラ中心の簡易モデル。未反映pt・休憩・手打ち・特攻変動があるため実際の残数を確定するものではありません。</p></section>
<section id="history" hidden><h2>観測履歴</h2><div id="records"></div><button id="export">履歴をCSV出力</button></section></main><script src="app.js?v=1.1" defer></script></body></html>
