<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乃木フェス イベントシミュレーター</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><div class="app"><nav id="nav" class="nav" aria-label="画面切り替え"><button data-page="play">⌂<small>プレイ</small></button><button data-page="result">▥<small>Result</small></button><button data-page="settings">⚙<small>設定</small></button><button data-page="history">▦<small>セット履歴</small></button><button data-page="help">?<small>使い方</small></button></nav><header class="banner"><h1>乃木フェス イベントシミュレーター</h1><div id="subtitle">初期設定画面</div></header><main id="content"></main></div><div id="wheelModal" class="modal" hidden><div class="dialog"><h2 id="wheelTitle">時間を設定</h2><div class="wheel-grid"><label>時間<select id="wh"></select></label><label>分<select id="wm"></select></label><label id="wsWrap">秒<select id="ws"></select></label></div><div class="actions"><button id="wheelCancel" class="ghost">キャンセル</button><button id="wheelOk" class="primary">決定</button></div></div></div><div id="confirmModal" class="modal" hidden><div class="dialog"><h2>イベントを終了しますか？</h2><p>現在のイベントの設定・結果・セット履歴は削除されます。この操作は取り消せません。</p><div class="actions"><button id="endCancel" class="ghost">キャンセル</button><button id="endOk" class="danger">イベント終了</button></div></div></div></body></html>
